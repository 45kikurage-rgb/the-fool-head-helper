name: Build THE fool head APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract Android project
        run: |
          rm -rf android-project
          mkdir android-project
          unzip -q the-fool-head-helper-project.zip -d android-project

      - name: Build debug APK
        working-directory: android-project
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: the-fool-head-helper-debug
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
